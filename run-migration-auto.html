<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHATEAU Platform - Auto Migration</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .status.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .status.warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #dee2e6;
        }
        .btn-secondary:hover { background: #e9ecef; }
        .progress {
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .log-entry { margin-bottom: 5px; }
        .log-success { color: #4ec9b0; }
        .log-error { color: #f48771; }
        .log-info { color: #9cdcfe; }
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
        }
        .input-group input:focus { outline: none; border-color: #667eea; }
        .step {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #f8f9fa;
        }
        .step-number {
            width: 30px;
            height: 30px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .step.completed .step-number { background: #4ec9b0; }
        .step-content { flex: 1; }
        .step-title { font-weight: 600; color: #333; }
        .step-desc { font-size: 13px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 CHATEAU Platform</h1>
        <p class="subtitle">Database Migration & Setup</p>

        <div id="setupForm">
            <div class="input-group">
                <label>อีเมลสำหรับเจ้าของ (Owner Email):</label>
                <input type="email" id="ownerEmail" placeholder="owner@example.com" value="owner@example.com">
            </div>
            <div class="input-group">
                <label>ชื่อบริษัท/องค์กร:</label>
                <input type="text" id="tenantName" placeholder="My Company" value="CHATEAU Platform">
            </div>
            <div class="input-group">
                <label>ชื่อเจ้าของ (Full Name):</label>
                <input type="text" id="ownerName" placeholder="Owner Name" value="Admin User">
            </div>

            <button class="btn-primary" onclick="startMigration()">
                เริ่มการติดตั้ง (Start Migration)
            </button>
        </div>

        <div id="progressSection" class="hidden">
            <div class="status info">
                <span id="statusText">กำลังดำเนินการ...</span>
            </div>
            <div class="progress">
                <div class="progress-bar" id="progressBar" style="width: 0%"></div>
            </div>

            <div id="steps"></div>

            <div class="log" id="log"></div>
        </div>

        <div id="completeSection" class="hidden">
            <div class="status success">
                ✅ ติดตั้งสำเร็จ! (Migration Complete)
            </div>

            <div class="step completed">
                <div class="step-number">✓</div>
                <div class="step-content">
                    <div class="step-title">Database Schema Created</div>
                    <div class="step-desc">ตาราง tenants, users, user_tenants พร้อมใช้งาน</div>
                </div>
            </div>

            <div class="step completed">
                <div class="step-number">✓</div>
                <div class="step-content">
                    <div class="step-title">Owner Account Ready</div>
                    <div class="step-desc" id="ownerInfo"></div>
                </div>
            </div>

            <div class="step completed">
                <div class="step-number">✓</div>
                <div class="step-content">
                    <div class="step-title">RLS Policies Enabled</div>
                    <div class="step-desc">Row Level Security พร้อมใช้งาน</div>
                </div>
            </div>

            <button class="btn-primary" onclick="goToLogin()">
                ไปที่หน้า Login →
            </button>
            <button class="btn-secondary" onclick="location.reload()">
                เริ่มใหม่
            </button>
        </div>

        <div id="errorSection" class="hidden">
            <div class="status error">
                ❌ เกิดข้อผิดพลาด (Error Occurred)
            </div>
            <div class="log" id="errorLog"></div>
            <button class="btn-secondary" onclick="location.reload()">
                ลองใหม่
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pqnjvcbmnatrtvpqnrdx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxbmp2Y2JtbmF0cnR2cHFucmR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU5ODM2NTEsImV4cCI6MjA4MTU1OTY1MX0.8YSVEdOvlJHkupqMJXy3HUtV-7L-OtcRTjd9rYVPFk0';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateProgress(percent, text) {
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('statusText').textContent = text;
        }

        function addStep(title, desc, completed = false) {
            const stepsDiv = document.getElementById('steps');
            const step = document.createElement('div');
            step.className = `step ${completed ? 'completed' : ''}`;
            step.innerHTML = `
                <div class="step-number">${completed ? '✓' : '→'}</div>
                <div class="step-content">
                    <div class="step-title">${title}</div>
                    <div class="step-desc">${desc}</div>
                </div>
            `;
            stepsDiv.appendChild(step);
        }

        async function startMigration() {
            const ownerEmail = document.getElementById('ownerEmail').value;
            const tenantName = document.getElementById('tenantName').value;
            const ownerName = document.getElementById('ownerName').value;

            if (!ownerEmail || !tenantName) {
                alert('กรุณากรอกข้อมูลให้ครบ');
                return;
            }

            document.getElementById('setupForm').classList.add('hidden');
            document.getElementById('progressSection').classList.remove('hidden');

            log('Starting migration...', 'info');
            addStep('เตรียมการติดตั้ง', 'กำลังเชื่อมต่อฐานข้อมูล...');

            try {
                // Step 1: Check connection
                updateProgress(10, 'กำลังเชื่อมต่อฐานข้อมูล...');
                log('Testing database connection...', 'info');

                const { data: testData, error: testError } = await supabase
                    .from('tenants')
                    .select('id')
                    .limit(1);

                if (testError && testError.code === '42P01') {
                    log('Tables do not exist. Need to run SQL setup.', 'warning');
                    alert('⚠️ ต้องรัน SQL ก่อน!\n\nไปที่: https://pqnjvcbmnatrtvpqnrdx.supabase.co/project/sql\nคัดลอก SQL จากไฟล์ auth_setup.sql แล้วกด RUN');
                    showError('Tables not found. Please run SQL migration first.');
                    return;
                }

                addStep('เชื่อมต่อฐานข้อมูลสำเร็จ', 'Connection established', true);
                log('Database connection OK!', 'success');

                // Step 2: Check if user exists
                updateProgress(30, 'ตรวจสอบผู้ใช้...');
                log(`Checking for user: ${ownerEmail}`, 'info');

                const { data: { users } } = await supabase.auth.admin.listUsers();
                const existingUser = users.find(u => u.email === ownerEmail);

                if (!existingUser) {
                    log(`User ${ownerEmail} not found in auth.users`, 'warning');
                    addStep('สร้างผู้ใช้ใหม่', `กรุณาสมัครสมาชิกที่หน้า Login หรือใช้ Supabase Dashboard`);

                    alert('⚠️ ไม่พบผู้ใช้ในระบบ\n\nกรุณาสร้าง user ก่อน:\n1. ไปที่ Supabase Dashboard → Authentication → Users\n2. กด "Add user"\n3. ใส่อีเมลและรหัสผ่าน\n4. กด "Create user"');
                    showError('User not found. Please create user first.');
                    return;
                }

                addStep('ตรวจสอบผู้ใช้', `พบผู้ใช้: ${ownerEmail}`, true);
                log(`Found user: ${existingUser.id}`, 'success');

                // Step 3: Create tenant with owner
                updateProgress(50, 'สร้าง Tenant และกำหนดสิทธิ์ Owner...');
                log(`Creating tenant: ${tenantName}`, 'info');

                const { data: tenantData, error: tenantError } = await supabase.rpc('create_tenant_with_owner', {
                    tenant_name: tenantName,
                    owner_email: ownerEmail,
                    owner_full_name: ownerName
                });

                if (tenantError) {
                    log(`Error creating tenant: ${tenantError.message}`, 'error');
                    throw tenantError;
                }

                log(`Tenant created successfully!`, 'success');
                addStep('สร้าง Tenant', `สร้าง "${tenantName}" สำเร็จ`, true);

                // Step 4: Verify
                updateProgress(80, 'ตรวจสอบข้อมูล...');
                log('Verifying setup...', 'info');

                const { data: verifyData } = await supabase
                    .from('user_tenants')
                    .select('*, tenants(*)')
                    .eq('user_id', existingUser.id)
                    .single();

                if (verifyData) {
                    log(`Role verified: ${verifyData.role}`, 'success');
                    addStep('ยืนยันสิทธิ์', `สิทธิ์: ${verifyData.role.toUpperCase()}`, true);
                }

                // Complete!
                updateProgress(100, 'สำเร็จ!');
                log('Migration complete!', 'success');

                setTimeout(() => {
                    document.getElementById('progressSection').classList.add('hidden');
                    document.getElementById('completeSection').classList.remove('hidden');
                    document.getElementById('ownerInfo').innerHTML = `
                        Email: ${ownerEmail}<br>
                        Tenant: ${tenantName}<br>
                        Role: OWNER
                    `;
                }, 1000);

            } catch (error) {
                log(`Error: ${error.message}`, 'error');
                showError(error.message);
            }
        }

        function showError(message) {
            document.getElementById('progressSection').classList.add('hidden');
            document.getElementById('errorSection').classList.remove('hidden');
            document.getElementById('errorLog').textContent = message;
        }

        function goToLogin() {
            window.location.href = 'http://localhost:5174/auth/login';
        }
    </script>
</body>
</html>
