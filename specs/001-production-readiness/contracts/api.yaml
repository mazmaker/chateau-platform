openapi: 3.0.3
info:
  title: CHATEAU API
  description: Prop Tech Intelligence Platform API
  version: 1.0.0
  contact:
    name: CHATEAU Support
    email: support@chateau.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.chateau.com/v1
    description: Production server
  - url: https://dev-api.chateau.com/v1
    description: Development server

security:
  - BearerAuth: []
  - TenantHeader: []

paths:
  # Authentication
  /auth/signin:
    post:
      tags:
        - Authentication
      summary: Sign in user
      description: Authenticate user with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: password123
                tenant:
                  type: string
                  description: Tenant slug for multi-tenant login
                  example: acme-corp
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  session:
                    $ref: '#/components/schemas/Session'
                  tenant:
                    $ref: '#/components/schemas/Tenant'
                  role:
                    type: string
                    enum: [owner, admin, sales, viewer]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/signout:
    post:
      tags:
        - Authentication
      summary: Sign out user
      description: End user session
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successfully signed out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Get new access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Dashboard
  /dashboard/stats:
    get:
      tags:
        - Dashboard
      summary: Get dashboard statistics
      description: Retrieve dashboard metrics and KPIs
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - name: date_range
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d, 1y]
            default: 30d
          description: Date range for statistics
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by specific project
      responses:
        '200':
          description: Dashboard statistics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_sales:
                    type: number
                    example: 15000000
                  total_units:
                    type: integer
                    example: 45
                  conversion_rate:
                    type: number
                    example: 0.35
                  new_leads:
                    type: integer
                    example: 120
                  active_bookings:
                    type: integer
                    example: 23
                  top_performers:
                    type: array
                    items:
                      $ref: '#/components/schemas/SalesStats'

  # Properties
  /properties:
    get:
      tags:
        - Properties
      summary: List properties
      description: Get paginated list of properties with filters
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [available, reserved, sold, rented]
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: min_price
          in: query
          schema:
            type: number
            minimum: 0
        - name: max_price
          in: query
          schema:
            type: number
            minimum: 0
        - name: bedrooms
          in: query
          schema:
            type: integer
            minimum: 0
        - name: search
          in: query
          schema:
            type: string
            description: Search in title and description
      responses:
        '200':
          description: Properties retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Property'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    post:
      tags:
        - Properties
      summary: Create property
      description: Add new property to inventory
      security:
        - BearerAuth: []
        - TenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyCreate'
      responses:
        '201':
          description: Property created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /properties/{id}:
    get:
      tags:
        - Properties
      summary: Get property details
      description: Retrieve detailed information about a specific property
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Property details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags:
        - Properties
      summary: Update property
      description: Update property information
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyUpdate'
      responses:
        '200':
          description: Property updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - Properties
      summary: Delete property
      description: Remove property from inventory
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Property deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  /properties/{id}/lock:
    post:
      tags:
        - Properties
      summary: Lock property
      description: Reserve property for 15 minutes
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Property locked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  lock_expires_at:
                    type: string
                    format: date-time
        '400':
          description: Property already locked or unavailable
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /properties/{id}/unlock:
    post:
      tags:
        - Properties
      summary: Unlock property
      description: Release property reservation
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Property unlocked successfully
        '403':
          description: Only the user who locked can unlock
        '404':
          $ref: '#/components/responses/NotFound'

  # Customers
  /customers:
    get:
      tags:
        - Customers
      summary: List customers
      description: Get paginated list of customers
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [lead, contacted, qualified, converted, lost]
        - name: sales_staff_id
          in: query
          schema:
            type: string
            format: uuid
        - name: source
          in: query
          schema:
            type: string
            enum: [walk_in, web_form, line, referral]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Customers retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags:
        - Customers
      summary: Create customer
      description: Add new customer lead
      security:
        - BearerAuth: []
        - TenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /customers/{id}:
    get:
      tags:
        - Customers
      summary: Get customer details
      description: Retrieve customer with AI scores and history
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Customers
      summary: Update customer
      description: Update customer information
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /customers/{id}/assign:
    post:
      tags:
        - Customers
      summary: Assign customer to sales
      description: Assign or reassign customer to sales staff
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sales_staff_id
              properties:
                sales_staff_id:
                  type: string
                  format: uuid
                notes:
                  type: string
      responses:
        '200':
          description: Customer assigned
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  # Bookings
  /bookings:
    get:
      tags:
        - Bookings
      summary: List bookings
      description: Get paginated list of bookings
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled, completed]
        - name: customer_id
          in: query
          schema:
            type: string
            format: uuid
        - name: property_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bookings retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags:
        - Bookings
      summary: Create booking
      description: Create new property booking
      security:
        - BearerAuth: []
        - TenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Property is not available

  /bookings/{id}:
    put:
      tags:
        - Bookings
      summary: Update booking
      description: Update booking status or details
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingUpdate'
      responses:
        '200':
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'

  # Marketing
  /campaigns:
    get:
      tags:
        - Marketing
      summary: List campaigns
      description: Get marketing campaigns
      security:
        - BearerAuth: []
        - TenantHeader: []
      responses:
        '200':
          description: Campaigns retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Campaign'

    post:
      tags:
        - Marketing
      summary: Create campaign
      description: Create new marketing campaign
      security:
        - BearerAuth: []
        - TenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreate'
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'

  /reports/sales:
    get:
      tags:
        - Reports
      summary: Sales report
      description: Generate sales performance report
      security:
        - BearerAuth: []
        - TenantHeader: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: group_by
          in: query
          schema:
            type: string
            enum: [day, week, month, sales_staff, project]
            default: month
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv, excel]
            default: json
      responses:
        '200':
          description: Sales report generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    $ref: '#/components/schemas/SalesReportSummary'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SalesReportData'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    TenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-ID

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        avatar_url:
          type: string
          format: uri
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        expires_at:
          type: string
          format: date-time

    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        domain:
          type: string
        logo_url:
          type: string
          format: uri
        theme_config:
          type: object
          additionalProperties: true
        subscription_plan:
          type: string
          enum: [standard, premium]
        is_active:
          type: boolean

    Property:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        unit_number:
          type: string
        title:
          type: string
        property_type:
          type: string
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        area_sqm:
          type: number
        price:
          type: number
        status:
          type: string
          enum: [available, reserved, sold, rented]
        images:
          type: array
          items:
            type: string
            format: uri
        lock_expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    PropertyCreate:
      type: object
      required:
        - project_id
        - unit_number
        - title
        - property_type
        - price
      properties:
        project_id:
          type: string
          format: uuid
        unit_number:
          type: string
        title:
          type: string
        description:
          type: string
        property_type:
          type: string
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        area_sqm:
          type: number
        price:
          type: number
          minimum: 0
        images:
          type: array
          items:
            type: string
            format: uri
        specifications:
          type: object
          additionalProperties: true

    PropertyUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        price:
          type: number
          minimum: 0
        status:
          type: string
          enum: [available, reserved, sold, rented]
        images:
          type: array
          items:
            type: string
            format: uri
        specifications:
          type: object
          additionalProperties: true

    PropertyDetail:
      allOf:
        - $ref: '#/components/schemas/Property'
        - type: object
          properties:
            project:
              $ref: '#/components/schemas/Project'
            pricing_history:
              type: array
              items:
                type: object
                properties:
                  price:
                    type: number
                  changed_at:
                    type: string
                    format: date-time
                  changed_by:
                    type: string
            specifications:
              type: object
              additionalProperties: true

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        address:
          type: string
        province:
          type: string
        total_units:
          type: integer
        images:
          type: array
          items:
            type: string
            format: uri
        status:
          type: string

    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        assigned_sales_id:
          type: string
          format: uuid
          nullable: true
        source:
          type: string
          enum: [walk_in, web_form, line, referral]
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        purpose:
          type: string
          enum: [own_stay, investment, rental]
        budget_min:
          type: number
        budget_max:
          type: number
        potential_score:
          type: number
          minimum: 0
          maximum: 100
        financial_score:
          type: number
          minimum: 0
          maximum: 100
        status:
          type: string
          enum: [lead, contacted, qualified, converted, lost]
        last_contacted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CustomerCreate:
      type: object
      required:
        - first_name
        - last_name
        - source
      properties:
        source:
          type: string
          enum: [walk_in, web_form, line, referral]
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        id_number:
          type: string
        address:
          type: string
        purpose:
          type: string
          enum: [own_stay, investment, rental]
        budget_min:
          type: number
        budget_max:
          type: number
        preferred_provinces:
          type: array
          items:
            type: string
        notes:
          type: string
        assigned_sales_id:
          type: string
          format: uuid

    CustomerUpdate:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        purpose:
          type: string
          enum: [own_stay, investment, rental]
        budget_min:
          type: number
        budget_max:
          type: number
        notes:
          type: string
        status:
          type: string
          enum: [lead, contacted, qualified, converted, lost]

    CustomerDetail:
      allOf:
        - $ref: '#/components/schemas/Customer'
        - type: object
          properties:
            assigned_sales:
              $ref: '#/components/schemas/SalesStaff'
            ai_analysis:
              type: object
              properties:
                insights:
                  type: array
                  items:
                    type: string
                recommendations:
                  type: array
                  items:
                    type: string
                confidence_score:
                  type: number
            documents:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  url:
                    type: string
                    format: uri
                  type:
                    type: string
            contact_history:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  date:
                    type: string
                    format: date-time
                  notes:
                    type: string
                  by_user:
                    type: string

    SalesStaff:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        employee_id:
          type: string
        full_name:
          type: string
        email:
          type: string
          format: email
        department:
          type: string
        commission_rate:
          type: number
        target_monthly:
          type: number
        is_active:
          type: boolean
        stats:
          type: object
          properties:
            total_sales:
              type: number
            units_sold:
              type: integer
            conversion_rate:
              type: number

    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
