    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    message:
                      type: string
            example:
              error: Validation failed
              details:
                - field: email
                  message: Invalid email format

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
            example:
              error: Invalid or expired token
              code: INVALID_TOKEN

    Forbidden:
