<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Auth Status</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>CHATEAU Platform - Auth Status Check</h1>
    <div id="status"></div>
    <div id="user-info"></div>
    <div id="tenant-info"></div>

    <script>
        const { createClient } = supabase;

        const supabaseUrl = 'https://pqnjvcbmnatrtvpqnrdx.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxbmp2Y2JtbmF0cnR2cHFucmR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU5ODM2NTEsImV4cCI6MjA4MTU1OTY1MX0.8YSVEdOvlJHkupqMJXy3HUtV-7L-OtcRTjd9rYVPFk0';

        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        async function checkAuth() {
            const statusDiv = document.getElementById('status');
            const userDiv = document.getElementById('user-info');
            const tenantDiv = document.getElementById('tenant-info');

            statusDiv.innerHTML = '<p>Checking authentication status...</p>';

            const targetEmail = 'mazmakerv2.sup@gmail.com';

            // Get current session
            const { data: sessionData, error: sessionError } = await supabase.auth.getSession();

            if (sessionError) {
                statusDiv.innerHTML = `<p style="color: red;">Error: ${sessionError.message}</p>`;
                return;
            }

            if (sessionData.session) {
                const user = sessionData.session.user;
                statusDiv.innerHTML = `<p style="color: green;">✓ User is logged in: ${user.email}</p>`;

                userDiv.innerHTML = `
                    <h3>User Details:</h3>
                    <ul>
                        <li>ID: ${user.id}</li>
                        <li>Email: ${user.email}</li>
                        <li>Role: ${user.role}</li>
                        <li>Email Confirmed: ${user.email_confirmed_at ? 'Yes' : 'No'}</li>
                        <li>Created: ${new Date(user.created_at).toLocaleString()}</li>
                    </ul>
                `;

                // Check if this is our target user
                if (user.email === targetEmail) {
                    statusDiv.innerHTML += `<p style="color: blue;">🎯 This IS the user we're checking: ${targetEmail}</p>`;

                    // Try to get user's tenant memberships
                    try {
                        const { data: userTenants, error: tenantError } = await supabase
                            .from('user_tenants')
                            .select(`
                                *,
                                tenants:tenant_id (
                                    id,
                                    name,
                                    slug,
                                    status
                                )
                            `)
                            .eq('user_id', user.id);

                        if (tenantError) {
                            tenantDiv.innerHTML = `<p style="color: red;">Cannot check tenant permissions: ${tenantError.message}</p>`;
                            tenantDiv.innerHTML += `<p>This might mean:</p>
                                <ul>
                                    <li>The database tables don't exist yet</li>
                                    <li>RLS policies prevent access</li>
                                    <li>User hasn't been added to any tenant</li>
                                </ul>`;
                        } else {
                            if (userTenants && userTenants.length > 0) {
                                tenantDiv.innerHTML = `
                                    <h3>Tenant Memberships:</h3>
                                    ${userTenants.map(ut => `
                                        <div style="border: 1px solid #ccc; padding: 10px; margin: 10px 0;">
                                            <h4>${ut.tenants.name} (${ut.tenants.slug})</h4>
                                            <p><strong>Role:</strong> <span style="color: ${ut.role === 'owner' ? 'green' : 'orange'};">${ut.role.toUpperCase()}</span></p>
                                            <p><strong>Active:</strong> ${ut.is_active ? 'Yes' : 'No'}</p>
                                            <p><strong>Joined:</strong> ${new Date(ut.joined_at).toLocaleDateString()}</p>
                                            ${ut.role === 'owner' ? '<p style="color: green; font-weight: bold;">✅ OWNER ROLE DETECTED!</p>' : ''}
                                        </div>
                                    `).join('')}
                                `;

                                // Check if owner
                                const isOwner = userTenants.some(ut => ut.role === 'owner' && ut.is_active);
                                statusDiv.innerHTML += isOwner ?
                                    '<p style="color: green; font-weight: bold;">✅ USER HAS OWNER PRIVILEGES!</p>' :
                                    '<p style="color: orange;">❌ User is NOT an owner in any tenant</p>';
                            } else {
                                tenantDiv.innerHTML = '<p style="color: orange;">User has no tenant memberships</p>';
                            }
                        }
                    } catch (err) {
                        tenantDiv.innerHTML = `<p style="color: red;">Error checking permissions: ${err.message}</p>`;
                    }
                } else {
                    statusDiv.innerHTML += `<p style="color: orange;">❌ This is NOT the target user. Target: ${targetEmail}</p>`;
                }
            } else {
                statusDiv.innerHTML = '<p style="color: red;">❌ No user is logged in</p>';
                userDiv.innerHTML = '<p>Please log in to check permissions</p>';
            }
        }

        // Run check when page loads
        window.addEventListener('load', checkAuth);

        // Listen for auth changes
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') {
                setTimeout(checkAuth, 1000); // Recheck after auth change
            }
        });
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
        .warning {
            color: orange;
        }
    </style>
</body>
</html>
