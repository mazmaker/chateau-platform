<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHATEAU Platform - Complete Setup</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        input {
            width: 100%; padding: 12px; border: 2px solid #e9ecef;
            border-radius: 8px; font-size: 14px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%; padding: 15px; border: none; border-radius: 10px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .status {
            padding: 15px; border-radius: 10px; margin-bottom: 20px;
            font-size: 14px;
        }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.info { background: #d1ecf1; color: #0c5460; }
        .hidden { display: none; }
        .spinner {
            width: 20px; height: 20px; border: 2px solid #fff;
            border-top-color: transparent; border-radius: 50%;
            animation: spin 0.8s linear infinite; display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏰 CHATEAU Platform</h1>
        <p class="subtitle">สร้างบัญชีเจ้าของ (Owner Account)</p>

        <div id="status" class="status info" style="display:none;"></div>

        <div id="signupForm">
            <div class="form-group">
                <label>อีเมล (Email)</label>
                <input type="email" id="email" value="mazmakerv2.sup@gmail.com" />
            </div>
            <div class="form-group">
                <label>รหัสผ่าน (Password - 6+ characters)</label>
                <input type="password" id="password" value="password123" />
            </div>
            <div class="form-group">
                <label>ชื่อ-นามสกุล (Full Name)</label>
                <input type="text" id="fullName" value="Platform Owner" />
            </div>
            <div class="form-group">
                <label>ชื่อบริษัท (Company Name)</label>
                <input type="text" id="companyName" value="CHATEAU Platform" />
            </div>
            <button onclick="setupAll()">
                🚀 สร้างบัญชีและติดตั้งทั้งหมด
            </button>
        </div>

        <div id="progress" class="hidden">
            <div class="status info">
                <span class="spinner"></span> <span id="progressText">กำลังดำเนินการ...</span>
            </div>
        </div>

        <div id="success" class="hidden">
            <div class="status success">
                ✅ สำเร็จ! (Success)
            </div>
            <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
                <h3 style="margin-bottom: 15px;">📋 ข้อมูลของคุณ:</h3>
                <p><strong>อีเมล:</strong> <span id="successEmail"></span></p>
                <p><strong>บริษัท:</strong> <span id="successCompany"></span></p>
                <p><strong>สิทธิ์:</strong> <span style="color: green;">OWNER</span></p>
            </div>
            <button onclick="goToLogin()">
                ไปที่หน้า Login →
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pqnjvcbmnatrtvpqnrdx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxbmp2Y2JtbmF0cnR2cHFucmR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU5ODM2NTEsImV4cCI6MjA4MTU1OTY1MX0.8YSVEdOvlJHkupqMJXy3HUtV-7L-OtcRTjd9rYVPFk0';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                autoRefreshToken: false,
                persistSession: true
            }
        });

        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        function updateProgress(text) {
            document.getElementById('progressText').textContent = text;
        }

        async function setupAll() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullName').value;
            const companyName = document.getElementById('companyName').value;

            if (!email || !password || password.length < 6) {
                showStatus('กรุณากรอกข้อมูลให้ครบ (รหัสผ่านอย่างน้อย 6 ตัวอักษร)', 'error');
                return;
            }

            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('progress').classList.remove('hidden');

            try {
                // Step 1: Sign up user
                updateProgress('1/4 สร้างบัญชีผู้ใช้...');
                console.log('Signing up user...');

                const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName
                        }
                    }
                });

                if (signUpError) {
                    // Check if user already exists
                    if (signUpError.message.includes('already been registered')) {
                        console.log('User already exists, trying to sign in...');
                        updateProgress('1/4 บัญชีมีอยู่แล้ว กำลังล็อกอิน...');

                        const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({
                            email: email,
                            password: password
                        });

                        if (signInError) {
                            throw new Error('อีเมลหรือรหัสผ่านไม่ถูกต้อง หรือบัญชียังไม่ได้ยืนยัน');
                        }

                        // User signed in successfully, now create tenant
                        await createTenantAndFinish(signInData.user.id, email, fullName, companyName);
                        return;
                    }
                    throw signUpError;
                }

                console.log('User signed up:', signUpData.user?.id);

                // Step 2: Wait a bit for trigger to create user profile
                updateProgress('2/4 ตั้งค่าโปรไฟล์...');
                await new Promise(resolve => setTimeout(resolve, 2000));

                // Step 3: Create tenant
                updateProgress('3/4 สร้าง Tenant และกำหนดสิทธิ์ Owner...');
                console.log('Creating tenant...');

                const { data: tenantData, error: tenantError } = await supabase.rpc('create_tenant_with_owner', {
                    tenant_name: companyName,
                    owner_email: email,
                    owner_full_name: fullName
                });

                if (tenantError) {
                    console.error('Tenant error:', tenantError);
                    throw new Error('ไม่สามารถสร้าง Tenant ได้: ' + tenantError.message);
                }

                console.log('Tenant created:', tenantData);

                // Step 4: Complete!
                updateProgress('4/4 เสร็จสมบูรณ์!');
                await new Promise(resolve => setTimeout(resolve, 1000));

                showSuccess(email, companyName);

            } catch (error) {
                console.error('Setup error:', error);
                document.getElementById('progress').classList.add('hidden');
                document.getElementById('signupForm').classList.remove('hidden');
                showStatus('เกิดข้อผิดพลาด: ' + error.message, 'error');
            }
        }

        async function createTenantAndFinish(userId, email, fullName, companyName) {
            updateProgress('2/4 สร้าง Tenant และกำหนดสิทธิ์ Owner...');

            const { data: tenantData, error: tenantError } = await supabase.rpc('create_tenant_with_owner', {
                tenant_name: companyName,
                owner_email: email,
                owner_full_name: fullName
            });

            if (tenantError) {
                // Try manual creation
                console.log('RPC failed, trying manual creation...');

                // Create tenant
                const { data: newTenant, error: createError } = await supabase
                    .from('tenants')
                    .insert({
                        name: companyName,
                        slug: companyName.toLowerCase().replace(/\s+/g, '-')
                    })
                    .select()
                    .single();

                if (createError) {
                    throw new Error('ไม่สามารถสร้าง Tenant: ' + createError.message);
                }

                // Link user to tenant
                const { error: linkError } = await supabase
                    .from('user_tenants')
                    .insert({
                        user_id: userId,
                        tenant_id: newTenant.id,
                        role: 'owner',
                        is_active: true
                    });

                if (linkError) {
                    throw new Error('ไม่สามารถกำหนดสิทธิ์ Owner: ' + linkError.message);
                }
            }

            updateProgress('3/4 เสร็จสมบูรณ์!');
            await new Promise(resolve => setTimeout(resolve, 1000));

            showSuccess(email, companyName);
        }

        function showSuccess(email, company) {
            document.getElementById('progress').classList.add('hidden');
            document.getElementById('success').classList.remove('hidden');
            document.getElementById('successEmail').textContent = email;
            document.getElementById('successCompany').textContent = company;
        }

        function goToLogin() {
            window.location.href = 'http://localhost:5174/auth/login';
        }
    </script>
</body>
</html>
